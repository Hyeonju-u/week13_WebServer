# 웹 서버 + 리버스 프록시 예시 설정 (docs/step4-proxy.md 4번, G15)
# 실행: ./build/server server.conf
# 형식: 한 줄에 "키 값", '#' 뒤는 주석. 시간은 ms/s, 크기는 K/M 단위 필수.
# 틀리면 "파일:줄: 이유"를 찍고 시작하지 않는다 (종료 코드 2).

listen 8080
# 정적 파일 루트 (시작할 때 realpath로 확인, 없으면 종료 코드 1)
root ./www

# /api, /api/... 는 백엔드로 (경로 조각 경계, 먼저 적힌 규칙이 이김).
# 더 구체적인 규칙을 위에 적는다. 경로는 떼지 않고 그대로 넘긴다.
route /api least_conn 127.0.0.1:8001 127.0.0.1:8002

# 아래는 기본값 그대로 (적지 않아도 됨)
max_body 1M
max_backend_response 8M
header_timeout 60s
body_timeout 60s
send_timeout 60s
keepalive_timeout 75s
linger_quiet 5s
linger_total 30s
backend_connect_timeout 5s
backend_send_timeout 60s
backend_read_timeout 60s
backend_fail_timeout 10s
access_log on
