<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹서버 README 실증 덱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 1280×720 무대 하나를 화면에 맞춰 줄이고 늘림. 한 번에 슬라이드 하나, 스크롤 없음.
   단일 어두운 무대(발표용)로 고정: 색은 모두 아래 토큰에서 나온다 */
:root {
  color-scheme: dark;
  --room: #0b0e14;
  --stage: #121722;
  --panel: #1a2130;
  --term: #0d1119;
  --fg: #e8ecf3;
  --muted: #98a2b5;
  --line: #2a3346;
  --accent: #7aa2ff;
  --accent-ink: #0b1430;
  --send: #8fb4ff;
  --recv: #86dba4;
  --good: #5fd08f;
  --good-soft: #163525;
  --bad: #ff8a80;
  --limit: #e9c46a;
  --limit-soft: #3a3118;
  --warm: #f0a070;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--room); color: var(--fg); font-family: var(--font-body);
  overflow: hidden; margin: 0;
}
.viewport { position: fixed; inset: 0; overflow: hidden; }
.stage {
  width: 1280px; height: 720px; background: var(--stage); position: absolute; left: 50%; top: 50%;
  transform-origin: center center; border-radius: 6px; overflow: hidden;
}
.slide { position: absolute; inset: 0; padding: 44px 56px 84px; display: none; flex-direction: column; gap: 18px; }
.slide.active { display: flex; }
.topline { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); letter-spacing: 0.04em; }
.topline .section { color: var(--accent); font-weight: 600; }
h1, h2 { margin: 0; text-wrap: balance; line-height: 1.25; }
.claim-title { font-size: 34px; font-weight: 700; }
.claim-how { font-size: 18px; color: var(--muted); }

/* 실행 화면 */
.runner { flex: 1; display: grid; grid-template-columns: 1fr; gap: 14px; min-height: 0; }
.runner.with-chart { grid-template-columns: 1.25fr 1fr; }
.term {
  background: var(--term); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 20px; font-family: var(--font-mono); font-size: 15.5px; line-height: 1.7;
  overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 0;
}
.term .out { color: var(--send); }
.term .in { color: var(--recv); }
.term .cmd { color: var(--fg); font-weight: 600; }
.term .note { color: var(--muted); }
.term .placeholder { color: var(--muted); }
.term .ff { color: var(--limit); }
.cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--fg); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.chart-box { background: var(--term); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; min-height: 0; }
.chart-box h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 500; }
.chart-box svg { width: 100%; height: 100%; }
.controls { display: flex; align-items: center; gap: 18px; min-height: 56px; }
.run {
  font: inherit; font-size: 19px; font-weight: 700; padding: 12px 26px; border-radius: 10px; border: 0;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; gap: 10px; align-items: center;
  white-space: nowrap; flex: none;
}
.verdict .chip { white-space: nowrap; }
.clock { white-space: nowrap; }
.run:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.clock { font-family: var(--font-mono); font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
.verdict { margin-left: auto; display: none; align-items: center; gap: 14px; font-size: 19px; }
.verdict.show { display: inline-flex; }
.verdict .chip { font-weight: 700; padding: 6px 14px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.verdict .chip.limit { background: var(--limit-soft); color: var(--limit); }
.verdict .chip.no { background: #3d2120; color: var(--bad); }
.verdict .evidence { font-family: var(--font-mono); font-weight: 600; }

/* 표지·구역·마무리 */
.cover { justify-content: center; gap: 26px; }
.cover .eyebrow { font-size: 17px; color: var(--accent); letter-spacing: 0.08em; }
.cover h1 { font-size: 56px; }
.cover p { font-size: 21px; color: var(--muted); max-width: 46ch; line-height: 1.6; margin: 0; }
.pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 10px; }
.pillar { background: var(--panel); border-radius: 10px; padding: 16px 18px; display: grid; gap: 4px; }
.pillar b { font-size: 19px; }
.pillar span { color: var(--muted); font-size: 15px; }
.divider { justify-content: center; gap: 18px; }
.divider .num { font-family: var(--font-mono); font-size: 22px; color: var(--accent); }
.divider h1 { font-size: 64px; }
.divider p { font-size: 25px; color: var(--muted); margin: 0; }
.divider ul { margin: 12px 0 0; padding-left: 22px; color: var(--muted); font-size: 18px; line-height: 1.8; }

/* wrk 구역 */
.lanes { display: grid; gap: 22px; background: var(--panel); border-radius: 12px; padding: 26px 28px; }
.lane { display: grid; gap: 8px; }
.lane-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; }
.lane-count { font-family: var(--font-mono); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.track { height: 38px; background: var(--term); border-radius: 8px; overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 8px; }
.lane.multi .fill { background: var(--accent); }
.lane.multi .lane-count { color: var(--accent); }
.lane.single .fill { background: var(--warm); }
.lane.single .lane-count { color: var(--warm); }
.levels { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.levels button { font: inherit; font-size: 17px; padding: 10px 18px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.levels button + button { border-left: 1px solid var(--line); }
.levels button[aria-pressed="true"] { background: var(--fg); color: var(--stage); }
.race-foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; color: var(--muted); }
.race-foot b { font-family: var(--font-mono); font-size: 30px; color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; flex: 1; min-height: 0; }
.box { background: var(--panel); border-radius: 12px; padding: 20px 22px; display: grid; gap: 12px; align-content: start; min-height: 0; }
.box h3 { margin: 0; font-size: 18px; }
.bar-group { display: grid; gap: 5px; }
.bar-label { font-size: 14px; color: var(--muted); }
.bar-row { display: grid; grid-template-columns: 1fr 130px; gap: 10px; align-items: center; }
.bar { height: 18px; border-radius: 5px; }
.bar.multi { background: var(--accent); }
.bar.single { background: var(--warm); }
.bar-value { font-family: var(--font-mono); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.bar-value.bad { color: var(--bad); }
.legend { display: flex; gap: 22px; font-size: 16px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: -2px; }
.svg-text { fill: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.svg-grid { stroke: var(--line); stroke-width: 1; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 14px; }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.end-score { font-family: var(--font-mono); font-size: 96px; color: var(--good); line-height: 1; }
pre.cmds { margin: 0; background: var(--term); border-radius: 10px; padding: 18px 22px; font-family: var(--font-mono); font-size: 16px; line-height: 1.8; color: var(--fg); }

/* 넘기기 */
.nav {
  position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 14px;
  padding: 0 56px; border-top: 1px solid var(--line); background: var(--stage);
}
.nav button { font: inherit; font-size: 17px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
.nav .count { font-family: var(--font-mono); color: var(--muted); font-size: 15px; }
.nav .hint { margin-left: auto; color: var(--muted); font-size: 14px; }
.progress { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); transition: width 0.2s; }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } .fill { transition: none !important; } }
</style>

<div class="viewport"><div class="stage" id="stage">
  <div class="progress" id="progress"></div>
  <div id="slides"></div>
  <div class="nav">
    <button type="button" id="prev" aria-label="이전 슬라이드">◀ 이전</button>
    <button type="button" id="next" aria-label="다음 슬라이드">다음 ▶</button>
    <span class="count" id="count"></span>
    <span class="hint">← → 로 넘기기 · Enter로 실행</span>
  </div>
</div></div>

  const command = entries.find(entry => entry.text.startsWith("$ slowhttptest"));
  return entries.map(entry => {

};

function topline(label) {

    note = document.createElement("span");
    note.className = "ff";
    note.textContent = `⏩ 실제로는 ${gap.toFixed(1)}초 기다림 (빨리 감는 중)\n`;
    term.appendChild(note);
    term.scrollTop = term.scrollHeight;
  }
  const start = performance.now();
  while (alive()) {
    const ratio = duration ? Math.min((performance.now() - start) / duration, 1) : 1;
    const now = from + gap * ratio;
    showClock(now);
    if (onProgress && total) { onProgress(now / total); }
    if (ratio >= 1) { break; }
    await sleep(40);
  }
  if (note) { note.remove(); }
}

async function writeLine(term, text, alive) {
  const span = document.createElement("span");
  span.className = kindOf(text);
  term.appendChild(span);
  term.appendChild(document.createTextNode("\n"));
  const typed = span.className === "cmd" || span.className === "out";
  if (!typed || REDUCED) {
    span.textContent = text;
  } else {
    const step = Math.max(1, Math.ceil(text.length / 45));
    for (let i = 0; i < text.length && alive(); i += step) {
      span.textContent = text.slice(0, i + step);
      term.scrollTop = term.scrollHeight;
      await sleep(14);
    }
    span.textContent = text;
  }
  term.scrollTop = term.scrollHeight;
  if (!typed && !REDUCED) { await sleep(90); }
}

function drawAttack(svg, chart, progress) {
  const rows = chart.rows;
  if (!svg || !rows.length) { return; }
  const width = 460, height = 300, left = 46, right = 10, top = 12, bottom = 28;
  const maxT = rows[rows.length - 1].t;
  const maxY = Math.max(...rows.map(r => Math.max(r.connected, r.closed)));
  const yTop = Math.ceil(maxY / 250) * 250 || 250;
  const x = t => left + t / maxT * (width - left - right);
  const y = v => top + (1 - v / yTop) * (height - top - bottom);
  const shown = progress < 0 ? [] : rows.filter(r => r.t <= progress * maxT + 0.001);
  let html = "";
  for (let v = 0; v <= yTop; v += yTop / 4) {
    html += `<line class="svg-grid" x1="${left}" x2="${width - right}" y1="${y(v)}" y2="${y(v)}"/><text class="svg-text" x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  for (let t = 0; t <= maxT; t += 10) {
    html += `<text class="svg-text" x="${x(t)}" y="${height - 8}" text-anchor="middle">${t}초</text>`;
  }
  if (chart.marker) {
    html += `<line x1="${x(chart.marker)}" x2="${x(chart.marker)}" y1="${top}" y2="${height - bottom}" stroke="var(--fg)" stroke-dasharray="4 4" opacity="0.5"/>` +
      `<text class="svg-text" x="${x(chart.marker) + 5}" y="${top + 12}" style="fill:var(--fg)">${chart.marker}초</text>`;
  }
  if (shown.length) {
    html += `<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${shown.map(r => `${x(r.t)},${y(r.connected)}`).join(" ")}"/>`;
    html += `<polyline fill="none" stroke="var(--warm)" stroke-width="3" points="${shown.map(r => `${x(r.t)},${y(r.closed)}`).join(" ")}"/>`;
  }
  svg.innerHTML = html;
}

/* ── wrk 구역 ── */
const LOAD = DATA.load;
const MULTI = LOAD ? Math.max(...LOAD.runs.map(r => r.loops)) : 0;
const LEVELS = LOAD ? [...new Set(LOAD.runs.map(r => r.connections))].sort((a, b) => a - b) : [];
const findRun = (loops, c) => LOAD.runs.find(r => r.loops === loops && r.connections === c);
let raceLevel = LEVELS.includes(10000) ? 10000 : LEVELS[0];

function renderRace() {
  if (!LOAD) { return topline("② 동시성 · wrk") + "<h2 class='claim-title'>wrk 결과 없음</h2>"; }
  return topline("② 동시성 · wrk 부하 테스트") +
    `<h2 class="claim-title">같은 코어 9개, 같은 20초: 몇 건이나 처리했나</h2>
    <div class="claim-how">wrk 4.2 (과제 문서의 부하 도구) · 서버 코어 9개, wrk는 다른 코어 9개 · 2초 안에 응답 없으면 타임아웃</div>
    <div class="controls"><div class="levels" role="group" aria-label="동시 연결 수">${LEVELS.map(c =>
      `<button type="button" data-level="${c}">연결 ${fmt(c)}</button>`).join("")}</div>
      <button class="run" type="button" id="race-run">▶ 재생</button></div>
    <div class="lanes">
      <div class="lane multi"><div class="lane-head"><span>멀티 루프 (루프 ${MULTI}개)</span><span class="lane-count" id="race-multi">0</span></div><div class="track"><div class="fill" id="race-fill-multi"></div></div><div class="bar-label" id="race-sub-multi"></div></div>
      <div class="lane single"><div class="lane-head"><span>단일 루프 (루프 1개)</span><span class="lane-count" id="race-single">0</span></div><div class="track"><div class="fill" id="race-fill-single"></div></div><div class="bar-label" id="race-sub-single"></div></div>
    </div>
    <div class="race-foot"><span id="race-clock"></span><span id="race-verdict"></span></div>`;
}

let raceFrame = null;
function setRaceLevel(level) {
  raceLevel = level;
  cancelAnimationFrame(raceFrame);
  document.querySelectorAll("[data-level]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.level) === level)));
  const m = findRun(MULTI, level), s = findRun(1, level);
  document.getElementById("race-multi").textContent = "0";
  document.getElementById("race-single").textContent = "0";
  document.getElementById("race-fill-multi").style.width = "0%";
  document.getElementById("race-fill-single").style.width = "0%";
  document.getElementById("race-sub-multi").textContent = "";
  document.getElementById("race-sub-single").textContent = "";
  document.getElementById("race-clock").textContent = `동시 연결 ${fmt(level)}개 · ▶ 재생을 누르세요`;
  document.getElementById("race-verdict").innerHTML = "";
}

function playRace() {
  cancelAnimationFrame(raceFrame);
  const m = findRun(MULTI, raceLevel), s = findRun(1, raceLevel);
  const replayMs = REDUCED ? 1 : 6000, start = performance.now();
  const step = now => {
    const p = Math.min((now - start) / replayMs, 1);
    document.getElementById("race-multi").textContent = fmt(Math.round(m.ok * p));
    document.getElementById("race-single").textContent = fmt(Math.round(s.ok * p));
    document.getElementById("race-fill-multi").style.width = (p * 100) + "%";
    document.getElementById("race-fill-single").style.width = (s.ok / m.ok * p * 100) + "%";
    document.getElementById("race-clock").textContent = `${(m.seconds * p).toFixed(1)}초 / ${m.seconds}초 (6초로 줄여 재생)`;
    if (p < 1) { raceFrame = requestAnimationFrame(step); return; }
    document.getElementById("race-sub-multi").textContent = `초당 ${fmt(m.rps)} · p99 ${m.p99_ms} ms · 타임아웃 ${fmt(m.timeouts)}`;
    document.getElementById("race-sub-single").textContent = `초당 ${fmt(s.rps)} · p99 ${s.p99_ms} ms · 타임아웃 ${fmt(s.timeouts)}`;
    document.getElementById("race-verdict").innerHTML = `<b>${(m.ok / s.ok).toFixed(1)}배</b> 더 처리`;
  };
  raceFrame = requestAnimationFrame(step);
}

function renderBars() {
  if (!LOAD) { return ""; }
  const maxRps = Math.max(...LOAD.runs.map(r => r.rps));
  const maxP99 = Math.max(...LOAD.runs.map(r => r.p99_ms));
  const group = (key, max, format) => LEVELS.map(c => `<div class="bar-group"><span class="bar-label">동시 연결 ${fmt(c)}</span>` +
    [[MULTI, "multi"], [1, "single"]].map(([loops, name]) => {
      const r = findRun(loops, c);
      const bad = key === "p99_ms" && r.timeouts > 0;
      return `<div class="bar-row"><div><div class="bar ${name}" style="width:${(r[key] / max * 100).toFixed(1)}%"></div></div>` +
        `<span class="bar-value${bad ? " bad" : ""}">${format(r)}</span></div>`;
    }).join("") + "</div>").join("");
  return topline("② 동시성 · wrk 부하 테스트") +
    `<h2 class="claim-title">동시 연결이 늘어도 멀티 루프는 타임아웃 0건</h2>
    <div class="legend"><span><i style="background:var(--accent)"></i>멀티 루프 (${MULTI}개)</span><span><i style="background:var(--warm)"></i>단일 루프</span></div>
    <div class="grid2">
      <div class="box"><h3>초당 요청 수 (높을수록 좋음)</h3>${group("rps", maxRps, r => fmt(r.rps))}</div>
      <div class="box"><h3>p99 응답 시간 (낮을수록 좋음)</h3>${group("p99_ms", maxP99, r => r.p99_ms + " ms" + (r.timeouts ? ` · 타임아웃 ${fmt(r.timeouts)}` : ""))}</div>
    </div>`;
}

function renderScaling() {
  const scaling = DATA.scaling;
  if (!scaling) { return ""; }
  const points = scaling.points;
  const width = 640, height = 330, left = 56, right = 40, top = 16, bottom = 34;
  const last = points[points.length - 1];
  const maxRps = Math.max(...points.map(p => Math.max(p.rps, p.ideal_rps)));
  const yMax = Math.ceil(maxRps / 100000) * 100000;
  const x = loops => left + (loops - 1) / (last.loops - 1 || 1) * (width - left - right);
  const y = rps => top + (1 - rps / yMax) * (height - top - bottom);
  let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="루프 수별 초당 요청 수" style="width:100%;height:auto">`;
  for (let v = 0; v <= yMax; v += 100000) {
    svg += `<line class="svg-grid" x1="${left}" x2="${width - right}" y1="${y(v)}" y2="${y(v)}"/><text class="svg-text" x="${left - 8}" y="${y(v) + 4}" text-anchor="end">${v / 1000}k</text>`;
  }
  points.forEach(p => { svg += `<text class="svg-text" x="${x(p.loops)}" y="${height - 10}" text-anchor="middle">루프 ${p.loops}</text>`; });
  svg += `<polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5" points="${points.map(p => `${x(p.loops)},${y(p.ideal_rps)}`).join(" ")}"/>`;
  svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="3.5" points="${points.map(p => `${x(p.loops)},${y(p.rps)}`).join(" ")}"/>`;
  points.forEach(p => {
    svg += `<circle cx="${x(p.loops)}" cy="${y(p.rps)}" r="5" fill="var(--accent)"/><text class="svg-text" x="${x(p.loops)}" y="${y(p.rps) + 22}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${p.speedup}×</text>`;
  });
  svg += "</svg>";
  return topline("② 동시성 · 루프 수를 늘리면") +
    `<h2 class="claim-title">루프 2개까지는 정확히 2배, 9개에서 ${last.speedup}배</h2>
    <div class="grid2">
      <div class="box">${svg}<div class="legend"><span><i style="background:var(--accent)"></i>실제 측정</span><span><i style="background:var(--muted)"></i>모든 코어가 루프 1개만큼 일했다면</span></div></div>
      <div class="box"><table><thead><tr><th>루프</th><th>일한 코어</th><th>초당 요청</th><th>코어당</th></tr></thead><tbody>
        ${points.map(p => `<tr><td>${p.loops}</td><td>${p.busy_cores.toFixed(1)}</td><td>${fmt(p.rps)}</td><td>${fmt(p.rps_per_busy_core)}</td></tr>`).join("")}
      </tbody></table>
      <p class="claim-how" style="font-size:16px;margin:0">9배가 안 되는 이유: 루프 9개가 코어를 ${last.busy_cores.toFixed(1)}개분만 썼고(부하를 주는 wrk도 같은 노트북), 코어 하나당 처리량이 ${fmt(points[0].rps_per_busy_core)} → ${fmt(last.rps_per_busy_core)}로 줄었습니다. 이 노트북 CPU는 빠른 P코어 4개와 E코어가 섞여 있습니다.</p></div>
    </div>`;
}

function renderEnd() {
  return `<div class="topline"><span class="section">정리</span><span></span></div>
    <div style="display:flex;align-items:center;gap:36px;margin-top:20px"><div class="end-score">${passed}/${results.length}</div>
    <h2 class="claim-title" style="font-size:38px">README 주장을 실제 서버에서<br>그대로 재현했습니다</h2></div>
    <p class="claim-how">한계로 적은 Slow Read도 그대로 남아 있음을 확인했습니다. wrk 1만 연결: 멀티 루프 타임아웃 0건, 단일 루프 ${LOAD ? fmt(findRun(1, 10000).timeouts) : "-"}건.</p>
    <pre class="cmds">docker build -t webserver-demo demo     # 처음 한 번
demo/proof.sh shutdown                  # 주장을 터미널에서 직접 실행 (구역별)
demo/live.sh 9 1000 15                  # wrk 부하 + 코어 사용률 실시간</pre>`;
}

/* ── 넘기기 ── */
let current = 0;
function show(index) {
  index = Math.max(0, Math.min(slides.length - 1, index));
  playToken++;
  cancelAnimationFrame(raceFrame);
  document.querySelectorAll(".slide").forEach((el, i) => el.classList.toggle("active", i === index));
  current = index;
  document.getElementById("count").textContent = `${index + 1} / ${slides.length}`;
  document.getElementById("progress").style.width = ((index + 1) / slides.length * 100) + "%";
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === slides.length - 1;
  if (slides[index].kind === "claim") { resetClaim(index); }
  if (slides[index].kind === "race") { setRaceLevel(raceLevel); }
  if (location.hash !== "#s" + (index + 1)) { history.replaceState(null, "", "#s" + (index + 1)); }
}

function runCurrent() {
  if (slides[current].kind === "claim") { playClaim(current); }
  if (slides[current].kind === "race") { playRace(); }
}

function fitStage() {
  const stage = document.getElementById("stage");
  const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

document.getElementById("prev").addEventListener("click", () => show(current - 1));
document.getElementById("next").addEventListener("click", () => show(current + 1));
document.addEventListener("click", event => {
  const level = event.target.closest("[data-level]");
  if (level) { setRaceLevel(Number(level.dataset.level)); }
  if (event.target.closest(".run")) { runCurrent(); }
});
document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight" || event.key === "PageDown") { show(current + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft" || event.key === "PageUp") { show(current - 1); event.preventDefault(); }
  if (event.key === "Enter" && !event.target.closest("button")) { runCurrent(); event.preventDefault(); }
});
window.addEventListener("resize", fitStage);
drawSlides();
fitStage();
const fromHash = parseInt((location.hash.match(/^#s(\d+)$/) || [])[1], 10);
show(Number.isFinite(fromHash) ? fromHash - 1 : 0);
</script>
